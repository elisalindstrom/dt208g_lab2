<!doctype html>
<html lang="sv">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>dt208g_lab2</title>
</head>

<body>
  <div class="container">
    <main>
      <div class="content">
        <h1>Lägg till uppgifter i en att göra-lista</h1>
        <form id="task-form" autocomplete="off">
          <h2>Lägg till ny uppgift</h2>
          <label for="task-name">Uppgift</label>
          <input id="task-name" name="task-name" type="text">

          <label for="task-priority">Prioritet</label>
          <select name="task-priority" id="task-priority">
            <option value="" disabled selected>Välj</option>
            <option value="1">Hög</option>
            <option value="2">Normal</option>
            <option value="3">Låg</option>
          </select>

          <button id="submit-btn" type="submit">Lägg till</button>
          <p id="error-message" class="hidden"></p>
        </form>

        <div id="todo-list-container" class="hidden">
          <h2 id="todo-list-heading">Att göra-lista</h2>
          <ul id="todo-list"></ul>
        </div>
      </div>
    </main>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>

</html>
